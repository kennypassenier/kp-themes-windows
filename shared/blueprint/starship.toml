# GENERATED by kp-themes 7.1.0 (gates/generate-desktop.mjs) — KP Blueprint. Do not edit.
# Two lines, Garuda-style: who and where on the first, the prompt on the second.
"$schema" = 'https://starship.rs/config-schema.json'

palette = "kp"
add_newline = true
command_timeout = 800

format = """
[╭─](signal)$os$username[@](muted)$hostname $directory$git_branch$git_status$python$nodejs$rust$cmd_duration
[╰─](signal)$character"""

[palettes.kp]
signal = "#51D2EC"
accent = "#F0A742"
violet = "#C285E0"
ok = "#DEF7EF"
warn = "#FBEFDA"
danger = "#E25F5A"
ink = "#DFF2F6"
muted = "#A2C2CD"

[os]
disabled = false
style = "bold signal"
format = "[$symbol]($style)"

[os.symbols]
Arch = "\uf303 "
Linux = "\uf17c "
Windows = "\ue70f "

[username]
show_always = true
style_user = "bold accent"
style_root = "bold danger"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold violet"
format = "[$hostname]($style)"

[directory]
style = "bold warn"
read_only = " \uf023"
truncation_length = 4
truncate_to_repo = true
format = "[\uf07c $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "\ue725 "
style = "bold violet"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold danger"

[python]
style = "ok"
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[nodejs]
style = "ok"

[rust]
style = "signal"

[cmd_duration]
min_time = 2000
style = "muted"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold ok)"
error_symbol = "[❯](bold danger)"
vimcmd_symbol = "[❮](bold accent)"
